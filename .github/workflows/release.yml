# Release pdum-cc-miner: build the desktop artifacts and publish them to this
# repo's GitHub Releases.
#
# Publishing HERE is what makes the automatic GITHUB_TOKEN sufficient — there is
# no PAT to manage. It also has to be a release list nothing else writes to:
# electron-updater asks GitHub for the *latest release* and then reads
# latest-mac.yml out of whatever it finds, so a list shared with releases on a
# different cadence would 404 every installed app's update check.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for this release, e.g. 0.1.0 (no leading v)"
        required: true
      dry_run:
        description: "Build the artifacts but do NOT publish"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # arm64
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    # Lifted to the job so a step `if` can test it — the `secrets` context is
    # not available in a step-level `if`, but `env` is.
    env:
      APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # electron-builder wants a PATH to the .p8, not its contents. Written
      # outside the workspace so no `files` glob can sweep a signing key into a
      # bundle.
      - name: Materialise the App Store Connect key
        if: matrix.target == 'mac' && env.APPLE_API_KEY_B64 != ''
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.target }}
        env:
          PDUM_CC_MINER_VERSION: ${{ inputs.version }}
          # Opt-in, and only when this is not a dry run. electron-builder would
          # otherwise publish on its own the moment it detects CI.
          PDUM_CC_MINER_PUBLISH: ${{ inputs.dry_run && 'never' || 'always' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Absent → pack.mjs reports "unsigned" and carries on, which is right
          # for a dry run and loud for a real release.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm -C pdum-cc-miner run pack:${{ matrix.target }}

      # Kept regardless of publishing, so a dry run still produces something
      # inspectable and a failed publish does not also lose the build.
      - uses: actions/upload-artifact@v4
        with:
          name: pdum-cc-miner-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: |
            pdum-cc-miner/release/*.dmg
            pdum-cc-miner/release/*.zip
            pdum-cc-miner/release/*.AppImage
            pdum-cc-miner/release/*.deb
            pdum-cc-miner/release/*.yml
