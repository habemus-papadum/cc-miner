# CI for the evicted repo. Generated by scripts/evict.mjs — edit the template at
# scripts/_evicted/.github/workflows/ci.yml in pdum_aiui, not the copy, until
# this repo stops being re-generated.
#
# One job. There was a second — `smoke`, which packaged the app and drove it over
# CDP to prove the artifact boots — and it is deliberately gone: this repo ships
# NO corpus (src/data is personal telemetry, regenerated locally with cc-assay),
# so there is nothing for a booted app to render and the check could only ever
# assert the "no data yet" state.
#
# `pdum-cc-miner/electron/smoke.mjs` still exists and still works against a local
# corpus — `pnpm -C pdum-cc-miner smoke` after a `pack:dir`. It is a manual gate,
# not a CI one, until this repo has data it can legitimately carry.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
